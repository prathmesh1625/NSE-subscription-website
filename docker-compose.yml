version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nse_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in the environment}
    ports:
      - "${DB_PORT_EXTERNAL:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nse_backend
    restart: always
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=nse_subscription
      # Second database on the same Postgres server, owned by the scraper —
      # read-only, only for the admin API's "scraped companies" browser.
      - DB_NAME_INGESTION=${DB_NAME_INGESTION:-nse_ingestion}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in the environment}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in the environment}
      - MSG91_AUTH_KEY=${MSG91_AUTH_KEY:?MSG91_AUTH_KEY must be set in the environment}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID must be set in the environment}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET must be set in the environment}
      - PREMIUM_COUPON_100=${PREMIUM_COUPON_100:-PUREFRAME100}
      # Keep specific numbers (owner/test accounts) on a higher company limit
      # than their plan allows. Comma-separated, no country code needed.
      - COMPANY_LIMIT_OVERRIDE_MOBILES=${COMPANY_LIMIT_OVERRIDE_MOBILES:-}
      - COMPANY_LIMIT_OVERRIDE=${COMPANY_LIMIT_OVERRIDE:-150}
      # Lets this backend read WhatsApp PDF-delivery status from the bot
      # service's own admin API (GET /admin/delivery-status), for the
      # Central Dashboard's "who is/isn't receiving PDFs" view. Optional —
      # if unset, that feature just reports no data instead of failing.
      - BOT_ADMIN_URL=${BOT_ADMIN_URL:-http://bot:5000}
      - BOT_ADMIN_KEY=${BOT_ADMIN_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      bot:
        condition: service_started

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: nse_bot
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=nse_ingestion
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in the environment}
      - DB_NAME_SUB=nse_subscription
      - SCRAPER_BASE_PATH=/app
      - ENABLE_DB_WATCHER=${ENABLE_DB_WATCHER:-True}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN:?WHATSAPP_TOKEN must be set in the environment}
      - PHONE_NUMBER_ID=${PHONE_NUMBER_ID:-1094754613731490}
      - VERIFY_TOKEN=${VERIFY_TOKEN:-nse_bot_secret_2024}
      - FLASK_PORT=5000
      - BOT_DB_PATH=/app/bot_sqlite/bot_data.db
      - PORTAL_URL=${PORTAL_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Separate, more powerful Admin API key used ONLY to read OpenAI spend
      # for the Central Dashboard's "OpenAI cost today" stat. OPENAI_API_KEY
      # above cannot query billing. Leave unset to disable that stat card.
      - OPENAI_ADMIN_API_KEY=${OPENAI_ADMIN_API_KEY:-}
      # Branded short download links (equityalerts.in/t/<code>). Must be the public
      # origin that reaches this bot; set "" to fall back to raw NSE URLs.
      - SHORTLINK_BASE=${SHORTLINK_BASE:-https://equityalerts.in}
      # Dedicated metrics-table template for RESULTS filings (APPROVED in Meta).
      # Empty = results fall back to TEMPLATE_NAME.
      - TEMPLATE_RESULT_NAME=${TEMPLATE_RESULT_NAME:-nse_result_bits}
      # Shared secret the backend presents on GET /admin/delivery-status
      # (header x-bot-admin-key). Must match BOT_ADMIN_KEY on the backend
      # service above. Generate with `openssl rand -hex 32`.
      - BOT_ADMIN_KEY=${BOT_ADMIN_KEY:-}
    ports:
      - "5000:5000"
    volumes:
      - shared_storage:/app/storage
      - bot_sqlite_data:/app/bot_sqlite
    depends_on:
      db:
        condition: service_healthy

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    container_name: nse_scraper
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=nse_ingestion
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in the environment}
      # NOTE: the scraper is fully subscription-driven — it scrapes ONLY the
      # companies that currently have >=1 active subscription (via
      # symbolProvider -> subscribedCompanyRepository, refreshed every ~20s).
      # No static SYMBOLS list is used at runtime, so none is set here.
      - INTERVAL=${POLL_INTERVAL_MS:-20000}
      - MAX_RECORDS=${MAX_RECORDS:-10}
      - REQUEST_LIMIT=${REQUEST_LIMIT:-5}
      - DOWNLOAD_WORKERS=${DOWNLOAD_WORKERS:-10}
      - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE:-5000}
      - MAX_PENDING_JOBS=${MAX_PENDING_JOBS:-10000}
      - MARKET_START=${MARKET_START:-8}
      - MARKET_END=${MARKET_END:-18}
      - PDF_STORAGE_PATH=/app/storage/pdf
    volumes:
      - shared_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      bot:
        condition: service_started

  # Standalone BSE scraper. Deliberately a separate service from `scraper`:
  # BSE disseminates a large share of filings minutes before NSE does, and the
  # only way to keep that head start is to poll on its own tight loop with its
  # own download queue, independent of the NSE cycle and its backlog.
  bse-scraper:
    build:
      context: .
      dockerfile: bse-scraper/Dockerfile
    container_name: nse_bse_scraper
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      # Writes into the SAME announcements table the bot reads. Only its job
      # queues (bse_download_jobs / bse_failed_jobs) are private to it.
      - DB_NAME=nse_ingestion
      - SUB_DB_NAME=nse_subscription
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in the environment}
      # Like the NSE scraper, fully subscription-driven — it only scrapes
      # companies that currently have >=1 active subscription.
      - BSE_INTERVAL=${BSE_POLL_INTERVAL_MS:-8000}
      - BSE_MAX_PAGES=${BSE_MAX_PAGES:-6}
      - BSE_REQUEST_LIMIT=${BSE_REQUEST_LIMIT:-4}
      - BSE_DOWNLOAD_CONCURRENCY=${BSE_DOWNLOAD_CONCURRENCY:-8}
      - BSE_DOWNLOAD_BATCH=${BSE_DOWNLOAD_BATCH:-20}
      - BSE_MAX_DOWNLOAD_RETRIES=${BSE_MAX_DOWNLOAD_RETRIES:-8}
      - PDF_STORAGE_PATH=/app/storage/pdf
    volumes:
      - shared_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      bot:
        condition: service_started

  adminer:
    image: adminer
    container_name: nse_adminer
    restart: always
    environment:
      - SERVICE_FQDN_ADMINER_8080
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  metabase:
    image: metabase/metabase
    container_name: nse_metabase
    restart: always
    environment:
      - SERVICE_FQDN_METABASE_3000
      - MB_DB_FILE=/metabase-data/metabase.db
    expose:
      - "3000"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  shared_storage:
  bot_sqlite_data:
  metabase_data:
